<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photon Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            overflow: hidden;
            background: #0a0a1a;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #00ff88;
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #00ff8844;
            pointer-events: none;
            z-index: 10;
            font-size: 14px;
        }
        #info .title {
            color: #6bcbff;
            font-weight: bold;
            font-size: 18px;
        }
        #info .status {
            color: #ffd93d;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <canvas id="gpuCanvas"></canvas>

    <script type="module" src="index.js"></script>
</body>
</html>
